# Multi-model comparison via OpenRouter's hosted API. Manual-only
# (workflow_dispatch) sibling of juice-shop-security-report-openweight.yml:
# same matrix-per-model shape, but --provider openrouter
# (src/juicesecops/providers/openrouter.py) calls OpenRouter's hosted
# chat-completions API over HTTPS instead of loading any GGUF weights
# locally -- no GPU, no download, no `[gguf]` extra, just an HTTPS call per
# finding/file. That trades CPU-time limits for OpenRouter's own rate
# limits (see config/policy-openrouter.toml's comment), which is why this
# workflow scopes down to policy-openrouter.toml's 5-file cap rather than
# reusing policy-openweight.toml's 20.
#
# Requires the OPENROUTER_API_KEY repository secret (Settings -> Secrets
# and variables -> Actions). Without it, every llm-review leg fails
# immediately with the RuntimeError raised by
# OpenRouterSecurityProvider.__init__.
#
# Shape (same as the GGUF version):
#   1. "scan" runs Semgrep/Trivy/ZAP once and uploads the three scanner
#      JSON reports as an artifact, so they aren't re-run once per model.
#   2. "prepare-matrix" reads OPENROUTER_MODEL_CHOICES directly from the
#      Python package so the matrix can never drift out of sync with the
#      code's model list.
#   3. "llm-review" is a matrix job, one leg per model alias. Each leg
#      downloads the scanner reports from step 1, re-clones Juice Shop
#      (cheap, shallow), and runs `python -m juicesecops --provider
#      openrouter --model-id <alias>`. continue-on-error is set on the job
#      because OpenRouter's free-tier model roster rotates -- an alias
#      that stops being served must not fail the whole run, it should just
#      be absent from the combined report.
#   4. "combine" downloads whichever per-model reports actually succeeded
#      and merges them with `juicesecops-compare-models`
#      (src/juicesecops/compare_models_cli.py) into one comparison.md/
#      comparison.json with every model's findings side by side.

name: juice-shop-security-report-openrouter

on:
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read OPENROUTER_MODEL_CHOICES from the package
        id: models
        run: |
          MODELS=$(PYTHONPATH=src python3 -c "
          import json
          from juicesecops.providers.openrouter import OPENROUTER_MODEL_CHOICES
          print(json.dumps(sorted(OPENROUTER_MODEL_CHOICES)))
          ")
          echo "models=${MODELS}" >> "$GITHUB_OUTPUT"
          echo "Matrix models: ${MODELS}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip && python -m pip install semgrep

      - name: Prepare workspace
        run: |
          mkdir -p results/openrouter/scan
          chmod 777 results/openrouter/scan

      - name: Clone Juice Shop target
        run: ./scripts/fetch_juice_shop.sh

      - name: Run Semgrep
        run: semgrep --config p/owasp-top-ten --json --output results/openrouter/scan/semgrep.json targets/juice-shop

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targets/juice-shop
          format: json
          output: results/openrouter/scan/trivy.json
          scanners: vuln,secret
          exit-code: 0

      - name: Start Juice Shop
        run: |
          docker network create juice-shop-net || true
          docker run -d --name thesis-juice-shop --network juice-shop-net -p 3000:3000 bkimminich/juice-shop

      - name: Run ZAP baseline
        run: |
          chmod 777 results/openrouter/scan
          docker run --rm \
            --network juice-shop-net \
            -v "$PWD/results/openrouter/scan:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://thesis-juice-shop:3000 -J zap.json 2>&1 | tee results/openrouter/scan/zap-baseline.log || true

      - name: Upload scan inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-openrouter-scan-inputs
          path: results/openrouter/scan
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          docker rm -f thesis-juice-shop || true
          docker network rm juice-shop-net || true

  llm-review:
    needs: [prepare-matrix, scan]
    runs-on: ubuntu-latest
    # An OpenRouter free-tier model that gets deprecated/renamed must not
    # fail the whole workflow -- the "combine" job below just skips
    # whatever legs didn't produce a report.json.
    continue-on-error: true
    # Network calls, not local CPU inference, so this can be far tighter
    # than the GGUF workflow's 120: 5 files x 2 requests (review + triage)
    # should finish in a few minutes even with OpenRouter's free-tier rate
    # limiting. A leg stuck past 30 minutes is a real problem (stuck
    # retry/backoff, or a hung connection), not just a slow model.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare-matrix.outputs.models) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download scan inputs
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-openrouter-scan-inputs
          path: results/openrouter/scan

      - name: Clone Juice Shop target
        run: ./scripts/fetch_juice_shop.sh

      - name: Run juicesecops with --provider openrouter --model-id ${{ matrix.model }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "results/openrouter/${{ matrix.model }}"
          # targets/juice-shop is a fresh clone with no working-tree edits,
          # so a plain `git diff HEAD` is always empty. Diff against git's
          # well-known empty-tree object instead, so every in-scope file is
          # treated as "added" and reviewed as a one-time baseline scan.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          python -m juicesecops \
            --input results/openrouter/scan/semgrep.json \
            --input results/openrouter/scan/trivy.json \
            --input results/openrouter/scan/zap.json \
            --provider openrouter \
            --model-id "${{ matrix.model }}" \
            --target-repo targets/juice-shop \
            --policy config/policy-openrouter.toml \
            --base-ref "$EMPTY_TREE" \
            --head-ref HEAD \
            --output "results/openrouter/${{ matrix.model }}" \
            --no-fail

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-openrouter-report-${{ matrix.model }}
          path: results/openrouter/${{ matrix.model }}
          if-no-files-found: ignore

  combine:
    needs: [prepare-matrix, llm-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download every per-model report that succeeded
        uses: actions/download-artifact@v4
        with:
          pattern: juice-shop-openrouter-report-*
          path: results/openrouter/reports
          merge-multiple: false

      - name: Merge into one comparison report
        run: |
          REPORT_ARGS=()
          for dir in results/openrouter/reports/*/; do
            name="$(basename "$dir")"
            model="${name#juice-shop-openrouter-report-}"
            if [ -f "${dir}report.json" ]; then
              REPORT_ARGS+=(--report "${model}=${dir}report.json")
            else
              echo "Skipping ${model}: no report.json (model run likely failed)"
            fi
          done
          if [ "${#REPORT_ARGS[@]}" -eq 0 ]; then
            echo "No model reports available to merge -- every matrix leg failed."
            exit 1
          fi
          python -m juicesecops.compare_models_cli "${REPORT_ARGS[@]}" --output results/openrouter/comparison
          echo "Merged models: ${REPORT_ARGS[*]}"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-openrouter-comparison
          path: results/openrouter/comparison
          if-no-files-found: warn
