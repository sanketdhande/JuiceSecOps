# Local-compute counterpart to juice-shop-security-report.yml: same
# traditional-scanner stages (Semgrep, Trivy, ZAP), but the "Run thesis
# security gate" step uses LocalSecurityProvider (providers/local.py)
# instead of a hosted API -- it runs a quantized GGUF build of
# openai/gpt-oss-20b in-process via llama.cpp (CPU only). No API key, no
# account, no per-request billing: this exists specifically as a fallback
# for when Groq/OpenRouter/Hugging Face quota or credits run out.
#
# Trade-off: this is much slower than any hosted provider (quantized
# weights, no GPU on a standard GitHub-hosted runner), and the ~12GB model
# file is already at the edge of what the runner's disk/RAM can hold --
# hence the "Free disk space" step below, a well-known workaround that
# reclaims tens of GB by removing preinstalled toolchains this job never
# uses (.NET, Android SDK, GHC, the CodeQL bundle). If a run still doesn't
# finish in time, lower `max_changed_files` in config/policy.toml or pass
# `--skip-change-review` to shrink the amount of work per run.
#
# This is a separate workflow (not a second step in
# juice-shop-security-report.yml) so this and the other providers' runs are
# independent GitHub Actions jobs that can run in parallel instead of one
# job doing every pass sequentially.
name: juice-shop-security-report-local

on:
  workflow_dispatch

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[local,dev]'
          python -m pip install semgrep
        # `[local]` pulls in llama-cpp-python (CPU inference engine) and
        # huggingface_hub (downloads/caches the GGUF file) for
        # LocalSecurityProvider. No hosted API, no API key.

      - name: Prepare workspace
        run: |
          mkdir -p results/ci
          chmod 777 results/ci

      - name: Clone Juice Shop target
        run: ./scripts/fetch_juice_shop.sh

      # --- traditional scanners: no LLM involved yet, just JSON output ---
      - name: Run Semgrep
        run: semgrep --config p/owasp-top-ten --json --output results/ci/semgrep.json targets/juice-shop

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targets/juice-shop
          format: json
          output: results/ci/trivy.json
          scanners: vuln,secret
          exit-code: 0

      - name: Start Juice Shop
        run: |
          docker network create juice-shop-net || true
          docker run -d --name thesis-juice-shop --network juice-shop-net -p 3000:3000 bkimminich/juice-shop

      - name: Run ZAP baseline
        run: |
          chmod 777 results/ci
          docker run --rm \
            --network juice-shop-net \
            -v "$PWD/results/ci:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://thesis-juice-shop:3000 -J zap.json 2>&1 | tee results/ci/zap-baseline.log || true
          echo "Contents of results/ci after ZAP:"
          ls -la results/ci || true

      # --- juicesecops: ingests the 3 scanner reports above, adds the
      # LLM diff-review + triage stages (see pipeline.py), then applies the
      # deterministic pass/fail gate (policy.py) ---
      - name: Run thesis security gate
        run: |
          if [ -f results/ci/zap.json ]; then
            ZAP_INPUT="--input results/ci/zap.json"
          else
            echo "ZAP report missing, continuing without ZAP input"
            ZAP_INPUT=""
          fi
          # targets/juice-shop is a fresh --depth 1 clone with no working-tree
          # edits, so a plain `git diff HEAD` is always empty and the LLM
          # change-review stage never runs. Diff against git's well-known
          # empty-tree object instead, so every in-scope file is treated as
          # "added" and reviewed as a one-time baseline scan of the checkout.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          python -m juicesecops \
            --input results/ci/semgrep.json \
            --input results/ci/trivy.json \
            $ZAP_INPUT \
            --provider local \
            --target-repo targets/juice-shop \
            --base-ref "$EMPTY_TREE" \
            --head-ref HEAD \
            --output results/ci \
            --no-fail
          echo "Juice Shop (local) report workflow completed. Gate status is recorded in results/ci/report.json and results/ci/report.md."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-security-report-local
          path: results/ci

      - name: Clean up
        if: always()
        run: |
          docker rm -f thesis-juice-shop || true
          docker network rm juice-shop-net || true
