# Full thesis pipeline: traditional scanners (Semgrep, Trivy, ZAP) run
# first and write JSON reports under results/ci/. The "Run thesis security
# gate" step then invokes the Python package in src/juicesecops/ via
# `python -m juicesecops` (entry point: src/juicesecops/__main__.py ->
# cli.py -> pipeline.py). That step is also where the LLM stage runs:
# pipeline.py diffs targets/juice-shop and hands each changed file to
# HuggingFaceSecurityProvider (providers/huggingface.py), which loads
# openai/gpt-oss-20b via transformers. This is a real ~20B-parameter model
# load on a standard GitHub-hosted runner (no GPU) -- expect a slow,
# CPU-bound run, and raise --model-id to a smaller checkpoint if it doesn't
# fit in the job's time/memory budget. All findings + the pass/fail gate
# end up in results/ci/report.json and report.md, uploaded as the
# juice-shop-security-report artifact below.
name: juice-shop-security-report

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install semgrep
        # `.[dev]` pulls in torch/transformers/accelerate too -- they're required
        # dependencies now that HuggingFaceSecurityProvider is the only
        # provider (pyproject.toml).

      - name: Prepare workspace
        run: |
          mkdir -p results/ci
          chmod 777 results/ci

      - name: Clone Juice Shop target
        run: ./scripts/fetch_juice_shop.sh

      # --- traditional scanners: no LLM involved yet, just JSON output ---
      - name: Run Semgrep
        run: semgrep --config p/owasp-top-ten --json --output results/ci/semgrep.json targets/juice-shop

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targets/juice-shop
          format: json
          output: results/ci/trivy.json
          scanners: vuln,secret
          exit-code: 0

      - name: Start Juice Shop
        run: |
          docker network create juice-shop-net || true
          docker run -d --name thesis-juice-shop --network juice-shop-net -p 3000:3000 bkimminich/juice-shop

      - name: Run ZAP baseline
        run: |
          chmod 777 results/ci
          docker run --rm \
            --network juice-shop-net \
            -v "$PWD/results/ci:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://thesis-juice-shop:3000 -J zap.json 2>&1 | tee results/ci/zap-baseline.log || true
          echo "Contents of results/ci after ZAP:"
          ls -la results/ci || true

      # --- juicesecops: ingests the 3 scanner reports above, adds the
      # LLM diff-review + triage stages (see pipeline.py), then applies the
      # deterministic pass/fail gate (policy.py) ---
      - name: Run thesis security gate
        run: |
          if [ -f results/ci/zap.json ]; then
            ZAP_INPUT="--input results/ci/zap.json"
          else
            echo "ZAP report missing, continuing without ZAP input"
            ZAP_INPUT=""
          fi
          # targets/juice-shop is a fresh --depth 1 clone with no working-tree
          # edits, so a plain `git diff HEAD` is always empty and the LLM
          # change-review stage never runs. Diff against git's well-known
          # empty-tree object instead, so every in-scope file is treated as
          # "added" and reviewed as a one-time baseline scan of the checkout.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          python -m juicesecops \
            --input results/ci/semgrep.json \
            --input results/ci/trivy.json \
            $ZAP_INPUT \
            --target-repo targets/juice-shop \
            --base-ref "$EMPTY_TREE" \
            --head-ref HEAD \
            --output results/ci \
            --no-fail
          echo "Juice Shop report workflow completed. Gate status is recorded in results/ci/report.json and results/ci/report.md."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-security-report
          path: results/ci

      - name: Clean up
        if: always()
        run: |
          docker rm -f thesis-juice-shop || true
          docker network rm juice-shop-net || true
