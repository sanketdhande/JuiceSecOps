# DVWA counterpart to juice-shop-security-report-openrouter.yml. Manual-only
# (workflow_dispatch), same matrix-per-model shape via OpenRouter's hosted
# API (src/juicesecops/providers/openrouter.py) instead of local GGUF
# weights -- see that workflow's header comment for the full rationale
# (rate limits vs. CPU-time limits, config/policy-openrouter.toml's cap).
#
# Requires the OPENROUTER_API_KEY repository secret, same as the Juice Shop
# version. Unlike Juice Shop, DVWA needs its own docker-compose stack (web
# + MariaDB) and a one-time database-setup request -- see the "Start DVWA"
# / "Initialize the DVWA database" steps below, copied from
# dvwa-security-report-openweight.yml.

name: dvwa-security-report-openrouter

on:
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read OPENROUTER_MODEL_CHOICES from the package
        id: models
        run: |
          MODELS=$(PYTHONPATH=src python3 -c "
          import json
          from juicesecops.providers.openrouter import OPENROUTER_MODEL_CHOICES
          print(json.dumps(sorted(OPENROUTER_MODEL_CHOICES)))
          ")
          echo "models=${MODELS}" >> "$GITHUB_OUTPUT"
          echo "Matrix models: ${MODELS}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip && python -m pip install semgrep

      - name: Prepare workspace
        run: |
          mkdir -p results/dvwa-openrouter/scan
          chmod 777 results/dvwa-openrouter/scan

      - name: Clone DVWA target
        run: ./scripts/fetch_dvwa.sh targets/dvwa

      - name: Run Semgrep
        run: semgrep --config p/owasp-top-ten --json --output results/dvwa-openrouter/scan/semgrep.json targets/dvwa

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targets/dvwa
          format: json
          output: results/dvwa-openrouter/scan/trivy.json
          scanners: vuln,secret
          exit-code: 0

      - name: Start DVWA
        working-directory: targets/dvwa
        run: docker compose up -d

      - name: Wait for DVWA to accept connections
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4280/login.php >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "DVWA did not come up in time, continuing anyway"

      - name: Initialize the DVWA database
        run: |
          # DVWA has no working login or challenges until its database is
          # created. setup.php is reachable pre-auth for exactly this reason
          # (there is no user table to log in against yet) -- pull its CSRF
          # token and submit the "Create / Reset Database" form once.
          COOKIE_JAR="$(mktemp)"
          SETUP_PAGE="$(curl -fsS -c "${COOKIE_JAR}" http://127.0.0.1:4280/setup.php || true)"
          SETUP_TOKEN="$(printf '%s' "${SETUP_PAGE}" | grep -oP "user_token'\s+value='\K[^']+" | head -n1 || true)"
          if [ -n "${SETUP_TOKEN}" ]; then
            curl -fsS -b "${COOKIE_JAR}" -c "${COOKIE_JAR}" \
              --data-urlencode "create_db=Create / Reset Database" \
              --data-urlencode "user_token=${SETUP_TOKEN}" \
              http://127.0.0.1:4280/setup.php >/dev/null || echo "Database setup request failed, continuing anyway"
          else
            echo "Could not find setup.php's CSRF token, continuing without database setup"
          fi
          rm -f "${COOKIE_JAR}"

      - name: Run ZAP baseline
        run: |
          chmod 777 results/dvwa-openrouter/scan
          docker run --rm \
            --network host \
            -v "$PWD/results/dvwa-openrouter/scan:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:4280 -J zap.json 2>&1 | tee results/dvwa-openrouter/scan/zap-baseline.log || true

      - name: Upload scan inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openrouter-scan-inputs
          path: results/dvwa-openrouter/scan
          if-no-files-found: warn

      - name: Clean up
        if: always()
        working-directory: targets/dvwa
        run: docker compose down --volumes || true

  llm-review:
    needs: [prepare-matrix, scan]
    runs-on: ubuntu-latest
    # An OpenRouter free-tier model that gets deprecated/renamed must not
    # fail the whole workflow -- the "combine" job below just skips
    # whatever legs didn't produce a report.json.
    continue-on-error: true
    # See juice-shop-security-report-openrouter.yml's llm-review job: these
    # are network calls, not local CPU inference, so 30 minutes is already
    # generous.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare-matrix.outputs.models) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download scan inputs
        uses: actions/download-artifact@v4
        with:
          name: dvwa-openrouter-scan-inputs
          path: results/dvwa-openrouter/scan

      - name: Clone DVWA target
        run: ./scripts/fetch_dvwa.sh targets/dvwa

      - name: Run juicesecops with --provider openrouter --model-id ${{ matrix.model }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "results/dvwa-openrouter/${{ matrix.model }}"
          # targets/dvwa is a fresh clone with no working-tree edits, so a
          # plain `git diff HEAD` is always empty. Diff against git's
          # well-known empty-tree object instead, so every in-scope file is
          # treated as "added" and reviewed as a one-time baseline scan.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          python -m juicesecops \
            --input results/dvwa-openrouter/scan/semgrep.json \
            --input results/dvwa-openrouter/scan/trivy.json \
            --input results/dvwa-openrouter/scan/zap.json \
            --provider openrouter \
            --model-id "${{ matrix.model }}" \
            --target-repo targets/dvwa \
            --policy config/policy-dvwa-openrouter.toml \
            --base-ref "$EMPTY_TREE" \
            --head-ref HEAD \
            --output "results/dvwa-openrouter/${{ matrix.model }}" \
            --no-fail

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openrouter-report-${{ matrix.model }}
          path: results/dvwa-openrouter/${{ matrix.model }}
          if-no-files-found: ignore

  combine:
    needs: [prepare-matrix, llm-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download every per-model report that succeeded
        uses: actions/download-artifact@v4
        with:
          pattern: dvwa-openrouter-report-*
          path: results/dvwa-openrouter/reports
          merge-multiple: false

      - name: Merge into one comparison report
        run: |
          REPORT_ARGS=()
          for dir in results/dvwa-openrouter/reports/*/; do
            name="$(basename "$dir")"
            model="${name#dvwa-openrouter-report-}"
            if [ -f "${dir}report.json" ]; then
              REPORT_ARGS+=(--report "${model}=${dir}report.json")
            else
              echo "Skipping ${model}: no report.json (model run likely failed)"
            fi
          done
          if [ "${#REPORT_ARGS[@]}" -eq 0 ]; then
            echo "No model reports available to merge -- every matrix leg failed."
            exit 1
          fi
          python -m juicesecops.compare_models_cli "${REPORT_ARGS[@]}" --output results/dvwa-openrouter/comparison
          echo "Merged models: ${REPORT_ARGS[*]}"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openrouter-comparison
          path: results/dvwa-openrouter/comparison
          if-no-files-found: warn
