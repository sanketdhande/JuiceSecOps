# DVWA counterpart to juice-shop-security-report-openweight.yml. Manual-only
# (workflow_dispatch) because it's the heaviest/slowest workflow for this
# target: it actually runs several quantized open-weight LLMs -- see
# src/juicesecops/providers/gguf.py's GGUF_MODEL_CHOICES -- via
# llama-cpp-python on CPU-only GitHub-hosted runners.
#
# Shape (same as the Juice Shop version):
#   1. "scan" runs Semgrep/Trivy/ZAP once against DVWA and uploads the three
#      scanner JSON reports as an artifact, so they aren't re-run once per
#      model. Unlike Juice Shop, DVWA needs its own docker-compose stack
#      (web + MariaDB) and a one-time database-setup request -- see the
#      "Start DVWA" / "Initialize the DVWA database" steps below.
#   2. "prepare-matrix" reads the model list straight from the Python
#      package so the workflow matrix can never drift out of sync with the
#      code's model list.
#   3. "llm-review" is a matrix job, one leg per model. Each leg downloads
#      the scanner reports from step 1, re-clones DVWA (cheap, shallow), and
#      runs `python -m juicesecops --provider gguf --model-id <alias>`.
#      continue-on-error is set on the job because GGUF_MODEL_CHOICES is a
#      best-effort mapping (see gguf.py) -- a renamed/missing quantization
#      for one model must not fail the whole run, it should just be absent
#      from the combined report.
#   4. "combine" downloads whichever per-model reports actually succeeded
#      and merges them with `juicesecops-compare-models`
#      (src/juicesecops/compare_models_cli.py) into one comparison.md/
#      comparison.json with every model's findings side by side.

name: dvwa-security-report-openweight

on:
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read GGUF_MODEL_CHOICES from the package
        id: models
        run: |
          MODELS=$(PYTHONPATH=src python3 -c "
          import json
          from juicesecops.providers.gguf import GGUF_MODEL_CHOICES
          print(json.dumps(sorted(GGUF_MODEL_CHOICES)))
          ")
          echo "models=${MODELS}" >> "$GITHUB_OUTPUT"
          echo "Matrix models: ${MODELS}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip && python -m pip install semgrep

      - name: Prepare workspace
        run: |
          mkdir -p results/dvwa-openweight/scan
          chmod 777 results/dvwa-openweight/scan

      - name: Clone DVWA target
        run: ./scripts/fetch_dvwa.sh targets/dvwa

      - name: Run Semgrep
        run: semgrep --config p/owasp-top-ten --json --output results/dvwa-openweight/scan/semgrep.json targets/dvwa

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targets/dvwa
          format: json
          output: results/dvwa-openweight/scan/trivy.json
          scanners: vuln,secret
          exit-code: 0

      - name: Start DVWA
        working-directory: targets/dvwa
        run: docker compose up -d

      - name: Wait for DVWA to accept connections
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4280/login.php >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "DVWA did not come up in time, continuing anyway"

      - name: Initialize the DVWA database
        run: |
          # DVWA has no working login or challenges until its database is
          # created. setup.php is reachable pre-auth for exactly this reason
          # (there is no user table to log in against yet) -- pull its CSRF
          # token and submit the "Create / Reset Database" form once.
          COOKIE_JAR="$(mktemp)"
          SETUP_PAGE="$(curl -fsS -c "${COOKIE_JAR}" http://127.0.0.1:4280/setup.php || true)"
          SETUP_TOKEN="$(printf '%s' "${SETUP_PAGE}" | grep -oP "user_token'\s+value='\K[^']+" | head -n1 || true)"
          if [ -n "${SETUP_TOKEN}" ]; then
            curl -fsS -b "${COOKIE_JAR}" -c "${COOKIE_JAR}" \
              --data-urlencode "create_db=Create / Reset Database" \
              --data-urlencode "user_token=${SETUP_TOKEN}" \
              http://127.0.0.1:4280/setup.php >/dev/null || echo "Database setup request failed, continuing anyway"
          else
            echo "Could not find setup.php's CSRF token, continuing without database setup"
          fi
          rm -f "${COOKIE_JAR}"

      - name: Run ZAP baseline
        run: |
          chmod 777 results/dvwa-openweight/scan
          docker run --rm \
            --network host \
            -v "$PWD/results/dvwa-openweight/scan:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:4280 -J zap.json 2>&1 | tee results/dvwa-openweight/scan/zap-baseline.log || true

      - name: Upload scan inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openweight-scan-inputs
          path: results/dvwa-openweight/scan
          if-no-files-found: warn

      - name: Clean up
        if: always()
        working-directory: targets/dvwa
        run: docker compose down --volumes || true

  llm-review:
    needs: [prepare-matrix, scan]
    runs-on: ubuntu-latest
    # A missing/renamed GGUF quantization for one model (see the
    # best-effort-mapping note in providers/gguf.py) must not fail the
    # whole workflow -- the "combine" job below just skips whatever legs
    # didn't produce a report.json.
    continue-on-error: true
    # See juice-shop-security-report-openweight.yml's llm-review job for why
    # this exists: without it, a stuck/too-slow leg only dies at GitHub's
    # unconfigurable 6-hour default, silently, mid-process.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare-matrix.outputs.models) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with the gguf extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gguf,dev]'

      - name: Download scan inputs
        uses: actions/download-artifact@v4
        with:
          name: dvwa-openweight-scan-inputs
          path: results/dvwa-openweight/scan

      - name: Clone DVWA target
        run: ./scripts/fetch_dvwa.sh targets/dvwa

      - name: Run juicesecops with --provider gguf --model-id ${{ matrix.model }}
        run: |
          mkdir -p "results/dvwa-openweight/${{ matrix.model }}"
          # targets/dvwa is a fresh clone with no working-tree edits, so a
          # plain `git diff HEAD` is always empty. Diff against git's
          # well-known empty-tree object instead, so every in-scope file is
          # treated as "added" and reviewed as a one-time baseline scan.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          python -m juicesecops \
            --input results/dvwa-openweight/scan/semgrep.json \
            --input results/dvwa-openweight/scan/trivy.json \
            --input results/dvwa-openweight/scan/zap.json \
            --provider gguf \
            --model-id "${{ matrix.model }}" \
            --target-repo targets/dvwa \
            --policy config/policy-dvwa-openweight.toml \
            --base-ref "$EMPTY_TREE" \
            --head-ref HEAD \
            --output "results/dvwa-openweight/${{ matrix.model }}" \
            --no-fail

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openweight-report-${{ matrix.model }}
          path: results/dvwa-openweight/${{ matrix.model }}
          if-no-files-found: ignore

  combine:
    needs: [prepare-matrix, llm-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download every per-model report that succeeded
        uses: actions/download-artifact@v4
        with:
          pattern: dvwa-openweight-report-*
          path: results/dvwa-openweight/reports
          merge-multiple: false

      - name: Merge into one comparison report
        run: |
          REPORT_ARGS=()
          for dir in results/dvwa-openweight/reports/*/; do
            name="$(basename "$dir")"
            model="${name#dvwa-openweight-report-}"
            if [ -f "${dir}report.json" ]; then
              REPORT_ARGS+=(--report "${model}=${dir}report.json")
            else
              echo "Skipping ${model}: no report.json (model run likely failed)"
            fi
          done
          if [ "${#REPORT_ARGS[@]}" -eq 0 ]; then
            echo "No model reports available to merge -- every matrix leg failed."
            exit 1
          fi
          python -m juicesecops.compare_models_cli "${REPORT_ARGS[@]}" --output results/dvwa-openweight/comparison
          echo "Merged models: ${REPORT_ARGS[*]}"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-openweight-comparison
          path: results/dvwa-openweight/comparison
          if-no-files-found: warn
