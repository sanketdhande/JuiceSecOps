[gate]
block_severity_floor = "critical"
review_severity_floor = "high"
block_risk_score = 70
review_risk_score = 45
fail_closed_on_provider_error = true

[privacy]
redact_secrets = true
max_evidence_chars = 500
max_diff_chars = 7000
max_snippet_chars = 2500

[changes]
# max_changed_files is spent in include_paths order, so raise it in step with
# that list if new high-value directories are added.
max_changed_files = 150
include_extensions = [".ts", ".js", ".html", ".json", ".yml", ".yaml"]
include_paths = [
  "server.ts",
  "app.ts",
  "lib/",
  "models/",
  "routes/",
  "Dockerfile",
  "package.json",
  "config/",
  "frontend/src/",
]
