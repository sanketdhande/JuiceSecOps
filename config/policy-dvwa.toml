[gate]
block_severity_floor = "critical"
review_severity_floor = "high"
block_risk_score = 70
review_risk_score = 45
fail_closed_on_provider_error = true
max_findings_per_run = 300

[privacy]
redact_secrets = true
max_evidence_chars = 500
max_diff_chars = 7000
max_snippet_chars = 2500

[changes]
# max_changed_files is spent in include_paths order, so raise it in step with
# that list if new high-value directories are added. Scoped to DVWA's PHP
# layout (see https://github.com/digininja/DVWA) rather than Juice Shop's
# TypeScript one -- vulnerabilities/ and hackable/ are where DVWA's
# intentionally-vulnerable code actually lives.
max_changed_files = 150
include_extensions = [".php", ".sql", ".yml", ".yaml", ".js", ".html"]
include_paths = [
  "vulnerabilities/",
  "hackable/",
  "includes/",
  "login.php",
  "setup.php",
  "index.php",
  "config/",
  "docker/",
  "compose.yml",
]
