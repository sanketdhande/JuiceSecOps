[gate]
block_severity_floor = "critical"
review_severity_floor = "high"
block_risk_score = 70
review_risk_score = 45
fail_closed_on_provider_error = true
max_findings_per_run = 300

[privacy]
redact_secrets = true
max_evidence_chars = 500
max_diff_chars = 7000
max_snippet_chars = 2500

[changes]
# Same scope as policy.toml, but max_changed_files is cut way down for a
# different reason than policy-openweight.toml's CPU-time cap: OpenRouter's
# free-tier (":free" suffix) models are rate-limited per API key, not per
# workflow -- as documented at https://openrouter.ai/docs at the time this
# was written, accounts without at least $10 of purchased credit are capped
# at 20 requests/minute AND 50 requests/day, shared across every ":free"
# model call made with that key. review_change() + triage() cost 2 requests
# per file per model, and the matrix in
# juice-shop-security-report-openrouter.yml runs every alias in
# OPENROUTER_MODEL_CHOICES, so the whole daily budget is shared across all
# of them, not per-model. 5 files x 2 requests x 3 models = 30 requests --
# comfortably under 50/day with room for a retry or a second target
# (dvwa-security-report-openrouter.yml) the same day. Raise this only if
# the OPENROUTER_API_KEY in use has purchased credit (raises the cap to
# 1000 requests/day) -- verify the current limits on your account before
# raising it, since OpenRouter's published numbers can change.
max_changed_files = 5
include_extensions = [".ts", ".js", ".html", ".json", ".yml", ".yaml"]
include_paths = [
  "server.ts",
  "app.ts",
  "lib/",
  "models/",
  "routes/",
  "Dockerfile",
  "package.json",
  "config/",
  "frontend/src/",
]
