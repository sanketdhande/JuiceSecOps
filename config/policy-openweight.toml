[gate]
block_severity_floor = "critical"
review_severity_floor = "high"
block_risk_score = 70
review_risk_score = 45
fail_closed_on_provider_error = true
max_findings_per_run = 300

[privacy]
redact_secrets = true
max_evidence_chars = 500
max_diff_chars = 7000
max_snippet_chars = 2500

[changes]
# Same scope as policy.toml, but max_changed_files is cut way down: this
# policy is for the multi-model GGUF workflow, where every file costs one
# serial CPU-inference call per model on a 2-vCPU GitHub-hosted runner. At
# 150 files (policy.toml's default) a single model leg ran for 5h45m+ and
# was still going when GitHub's unconfigurable 6-hour job ceiling would have
# killed it outright. 20 files keeps a full 5-model matrix leg inside the
# llm-review job's timeout-minutes below with room to spare.
max_changed_files = 20
include_extensions = [".ts", ".js", ".html", ".json", ".yml", ".yaml"]
include_paths = [
  "server.ts",
  "app.ts",
  "lib/",
  "models/",
  "routes/",
  "Dockerfile",
  "package.json",
  "config/",
  "frontend/src/",
]
