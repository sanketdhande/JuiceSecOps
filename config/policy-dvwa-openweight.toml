[gate]
block_severity_floor = "critical"
review_severity_floor = "high"
block_risk_score = 70
review_risk_score = 45
fail_closed_on_provider_error = true
max_findings_per_run = 300

[privacy]
redact_secrets = true
max_evidence_chars = 500
max_diff_chars = 7000
max_snippet_chars = 2500

[changes]
# Same scope as policy-dvwa.toml, but max_changed_files is cut way down --
# see policy-openweight.toml's comment for why: 150 files times one serial
# CPU-inference call per file per model easily runs past GitHub's
# unconfigurable 6-hour job ceiling. 20 keeps a full matrix leg inside
# llm-review's timeout-minutes with room to spare.
max_changed_files = 20
include_extensions = [".php", ".sql", ".yml", ".yaml", ".js", ".html"]
include_paths = [
  "vulnerabilities/",
  "hackable/",
  "includes/",
  "login.php",
  "setup.php",
  "index.php",
  "config/",
  "docker/",
  "compose.yml",
]
